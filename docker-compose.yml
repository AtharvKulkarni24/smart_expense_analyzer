version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: spendsense-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-spendsense_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - spendsense_pgdata:/var/lib/postgresql/data

volumes:
  spendsense_pgdata:
